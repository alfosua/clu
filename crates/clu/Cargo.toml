[package]
name = "clu"
version = "0.1.0"
edition = "2021"
license.workspace = true

[dependencies]
clu-core = { path = "../core" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "process", "io-std", "io-util", "sync"] }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { version = "4.5", features = ["derive"] }
