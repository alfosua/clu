[workspace]
members = [
    "crates/ai",
    "crates/core",
    "crates/tools",
    "crates/rpc",
    "crates/tui",
    "crates/sdk",
    "crates/clu"
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["alfos"]
license = "BSD-3-Clause"

[workspace.dependencies]
tokio = { version = "1.43", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
